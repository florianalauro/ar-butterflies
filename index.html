<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AR Butterflies & Data</title>
    
    <link rel="stylesheet" href="./src/style.css">

<script crossorigin="anonymous" src="./8thwall/xr.js" data-preload-chunks="slam" data-chunk-base-url="./8thwall/"></script>  </head>
  <body>
    <canvas id="webgl-canvas" style="position: absolute; top:0; left:0; width: 100vw; height: 100dvh; display: block; z-index: 1;"></canvas>

    <div id="ui-layer" style="position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 10;">
      <div id="data-container" style="display: none; position: absolute; transform: translate(-50%, -50%);">
        <h1 style="color: white; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px;">
          CO2 Risparmiata: <span id="co2-value">0</span>%
        </h1>
      </div>
    </div>

    <div id="start-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 20; display: flex; justify-content: center; align-items: center;">
      <button id="start-btn" style="padding: 18px 36px; font-size: 1.2rem; font-weight: bold; background-color: #ce0058; color: white; border: none; border-radius: 8px; cursor: pointer; display: none;">
        CARICAMENTO MOTORE AR...
      </button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
